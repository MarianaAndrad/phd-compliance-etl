services:
  db-mongo:
    image: mongo:8.0.17
    restart: always
    volumes:
      - 'db_mongo_data:/data/db'
      - "./mongodb.js:/docker-entrypoint-initdb.d/00.init.js:ro"
    ports:
      - ${MONGO_PORT}:27017
    env_file:
      - .env
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 15s
      timeout: 5s
      retries: 2

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
        ME_CONFIG_MONGODB_SERVER: db-mongo
        ME_CONFIG_MONGODB_PORT: 27017
        ME_CONFIG_BASICAUTH_USERNAME: ${DB_MONGO_USERNAME}
        ME_CONFIG_BASICAUTH_PASSWORD: ${DB_MONGO_PASSWORD}
        ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
        ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    depends_on:
      db-mongo:
        condition: service_healthy

volumes:
  db_mongo_data: